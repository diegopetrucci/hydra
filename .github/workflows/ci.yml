name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  oxlint:
    name: Oxlint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'npm'
          cache-dependency-path: daemon/package-lock.json

      - name: Install dependencies
        working-directory: daemon
        run: npm ci

      - name: Run Oxlint
        working-directory: daemon
        run: npm run lint

  oxfmt:
    name: Oxfmt
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'npm'
          cache-dependency-path: daemon/package-lock.json

      - name: Install dependencies
        working-directory: daemon
        run: npm ci

      - name: Check formatting with Oxfmt
        working-directory: daemon
        run: npm run format:check

  daemon:
    name: Daemon (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.23.4', '24.22.1', '26.12.1']
    defaults:
      run:
        working-directory: daemon
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: daemon/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: PI_CODING_AGENT_DIR="$(mktemp -d)" npm test
